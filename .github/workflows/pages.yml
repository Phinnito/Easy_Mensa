name: Deploy Chaetzli static site

on:
  push:
    branches: ["main"]
    paths:
      - "apps/**"
      - "src/**"
      - "data/recipes/**"
      - "data/knowledge/**"
      - "images/recipes/**"
      - "site/**"
      - "scripts/export_static_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate Python
        run: python -m compileall -q apps src scripts

      - name: Validate frontend JavaScript
        run: node --check site/app.js

      - name: Export static site
        run: python scripts/export_static_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
